<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dark Translucent Slate Squircle Gradient -->
    <linearGradient id="placeholderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Subtle Inner Border Highlight -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="2" y="2" width="124" height="124" rx="28" ry="28" fill="url(#placeholderBg)" stroke="url(#squircleBorder)" stroke-width="2" />

  <!-- 3 Rhythmic Synced Lyric Lines (Left-Aligned Minimalist Branding) -->
  <g fill="#FFFFFF">
    <!-- Line 1: Previous Lyric (Dimmed 40%) -->
    <rect x="28" y="36" width="46" height="11" rx="5.5" opacity="0.40" />

    <!-- Line 2: Active Lyric Highlight (Bold 100% White) -->
    <rect x="28" y="55" width="72" height="16" rx="8" opacity="1.00" />

    <!-- Line 3: Next Lyric (Dimmed 65%) -->
    <rect x="28" y="79" width="56" height="11" rx="5.5" opacity="0.65" />
  </g>
</svg>
