name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get app version
        id: app_version
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          echo "TAG=v$ver" >> $env:GITHUB_OUTPUT

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Build app and bundle NSIS installer
      # Avoid actions/cache and upload-artifact to keep GitHub Actions storage usage at 0 MB
      - name: Build Tauri application
        run: cargo tauri build

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.TAG }}
          name: Taskbar Lyrics ${{ steps.app_version.outputs.TAG }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/taskbar-lyrics.exe
          draft: false
          prerelease: false
          generate_release_notes: true
