[package]
name = "lyrix"
version = "0.2.0"
description = "Windows 11 taskbar lyric overlay"
authors = ["USER"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5.0"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

[profile.dev]
debug = 1

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
